# MaaHJ 的 MaaFwApp 打包配方
#
# 用法（配合 Android/build.ps1）：
#   $env:MAAHJ_ROOT = <仓库根目录>        # 例如 D:/Apps/MaaHJ/repo
#   配方里 ${MAAHJ_ROOT} 由 MaaFwApp 构建期展开，未设置会直接构建失败
#
# 字段语义见 MaaFwApp/INTEGRATION.md 与 pi-profile.sample.yaml

# 含 interface.json 那一层（桌面发布包的解包目录）
assets: ${MAAHJ_ROOT}/dist/package-mfaa

# 进包白名单：桌面端的 python/ libs/ runtimes/ MaaAgentBinary/ 等运行时二进制不会进 APK
include:
  - interface.json
  - tasks/**
  - resource/**
  - agent/**
  - LICENSE

exclude:
  - debug/**
  - "**/__pycache__/**"

# agent 必须在 PI 里声明；这里的 runtimes 与 interface.json 的 agent[] 按序一一对应
agent:
  sourceDir: ${MAAHJ_ROOT}/.build/agent-dist
  # 两个 ABI 都要有运行时，否则对应架构的包会「宣称支持但缺 agent」
  abi: [arm64-v8a, x86_64]
  runtimes:
    - location: bundle
      executable: bin/python3
      name: py-agent
      args: [-u, agent/main.py]
      env:
        PYTHONHOME: "{bundle}/prefix"
        PYTHONPATH: "{bundle}/site-packages/pure.zip:{bundle}/site-packages"
        LD_LIBRARY_PATH: "{bundle}/prefix/lib:{nativeLibs}"
        MAAFW_BINARY_PATH: "{nativeLibs}"

logs:
  include:
    - debug/**/*.log

# 前台模式：截图跟随手机主屏。
# presets 是后台模式（虚拟屏）的档位；本项目 ROI 按竖屏 720 短边标定，所以只给竖屏档。
# 竖屏档依赖 overrides/BuildProfile.kt 放开「必须 width > height」的校验，否则构建期直接失败。
display:
  foreground: true
  presets:
    - label: 720P
      width: 720
      height: 1280
      dpi: 320

app:
  id: maahj
  label: 哼唧小助手
  icon: logo.png
